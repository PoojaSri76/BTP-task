_schema-version: 3.3.0
ID: ui5practice
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: ui5practice-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: ui5practice-db
      - name: ui5practice-destination
      - name: ui5practice-auth

  - name: ui5practice-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: ui5practice-db

  - name: ui5practice-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: ui5practicetask3
          artifacts:
            - task3.zip
          target-path: app/
        - name: ui5practicetask4
          artifacts:
            - task4.zip
          target-path: app/
        - name: ui5practiceui5task
          artifacts:
            - ui5task.zip
          target-path: app/
    requires:
      - name: srv-api
      - name: ui5practice-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
      - name: ui5practice-auth
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            HTML5.ForwardAuthToken: true
            HTML5.DynamicDestination: true

  - name: ui5practicetask3
    type: html5
    path: app/task3
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: ui5practicetask4
    type: html5
    path: app/task4
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: ui5practiceui5task
    type: html5
    path: app/ui5task
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: ui5practice-destinations
    type: com.sap.application.content
    requires:
      - name: ui5practice-html5-repo-host
        parameters:
          service-key:
            name: ui5practice-html5-repo-host-key
      - name: srv-api
      - name: ui5practice-destination
        parameters:
          content-target: true
      - name: ui5practice-auth
        parameters:
          service-key:
            name: ui5practice-auth-key
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: ui5practice-html5-repository
              ServiceInstanceName: ui5practice-html5-repo-host
              ServiceKeyName: ui5practice-html5-repo-host-key
              sap.cloud.service: ui5practice.service
            - Name: ui5practice-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: ui5practice-auth
              ServiceKeyName: ui5practice-auth-key
              sap.cloud.service: ui5practice.service
  - name: ui5practice
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: ui5practice-destination
      - name: ui5practice-html5-runtime
      - name: ui5practice-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: ui5practice-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: ui5practice-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: ui5practice-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: ui5practice-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: ui5practice-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ui5practice-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
